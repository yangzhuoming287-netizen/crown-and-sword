.fcard .flord{font-size:12px;color:#9c8552;margin-top:3px}
.fcard .fdesc{font-size:12px;color:#b6a67f;margin-top:6px}
.fcard .fdiff{position:absolute;right:8px;top:8px;font-size:11px;color:#8a7746}
.bigbtn{

function buildGeo(){
  PIDX={}; CENTROID={};
  var pts=[], i;
  for(i=0;i<PROVINCES.length;i++){
    var p=PROVINCES[i];
    PIDX[p[0]]=i;
    pts.push({id:p[0], x:gx(p[2]), y:gy(p[3])});
  }
  RASTER=new Int16Array(RW*RH).fill(-1);
  for(var ry=0;ry<RH;ry++){
    for(var rx=0;rx<RW;rx++){
      var lon=LON0+(rx+0.5)/(SCALE*KX), lat=LAT1-(ry+0.5)/SCALE;
      if(!isLandPt(lon,lat)) continue;
      var best=-1, bd=1e9;
      for(i=0;i<pts.length;i++){
        var dx=pts[i].x-(rx+0.5), dy=pts[i].y-(ry+0.5), d=dx*dx+dy*dy;
        if(d<bd){ bd=d; best=i; }
      }
      RASTER[ry*RW+rx] = best;           // 全部陆地都归属，不留空白
    }
  }
  // 邻接：栅格相接即相邻
  for(i=0;i<PROVINCES.length;i++) ADJ[PROVINCES[i][0]]=[];
  var sx=new Array(pts.length).fill(0), sy=new Array(pts.length).fill(0), cnt=new Array(pts.length).fill(0);
  for(ry=0;ry<RH;ry++){
    for(rx=0;rx<RW;rx++){
      var v=RASTER[ry*RW+rx];
      if(v<0) continue;
      cnt[v]++; sx[v]+=rx; sy[v]+=ry;
      var nb=[[1,0],[0,1],[1,1],[1,-1]];
      for(var k=0;k<4;k++){
        var x2=rx+nb[k][0], y2=ry+nb[k][1];
        if(x2<0||y2<0||x2>=RW||y2>=RH) continue;
        var w=RASTER[y2*RW+x2];
        if(w>=0 && w!==v){
          var a=PROVINCES[v][0], b=PROVINCES[w][0];
          if(ADJ[a].indexOf(b)<0) ADJ[a].push(b);
          if(ADJ[b].indexOf(a)<0) ADJ[b].push(a);
        }
      }
    }
  }
  for(i=0;i<pts.length;i++){
    if(cnt[i]) CENTROID[ptS_id(pts,i)] = {rx:sx[i]/cnt[i], ry:sy[i]/cnt[i], area:cnt[i]};
  }
  // 跨海航线
  for(var s2=0;s2<SEA_LINKS.length;s2++){
    var x3=SEA_LINKS[s2][0], y3=SEA_LINKS[s2][1];
    if(!ADJ[x3]||!ADJ[y3]) continue;
    if(ADJ[x3].indexOf(y3)<0) ADJ[x3].push(y3);
    if(ADJ[y3].indexOf(x3)<0) ADJ[y3].push(x3);
  }
}
function ptS_id(pts,i){ return pts[i].id; }

var SKIN_KEY='crown_skin';
function curSkin(){ try{ return localStorage.getItem(SKIN_KEY)||'hist'; }catch(e){ return 'hist'; } }
function setSkin(s){ try{ localStorage.setItem(SKIN_KEY,s); }catch(e){} }
function portraitOf(fid){
  if(curSkin()==='ai' && typeof PORTRAITS_AI!=='undefined' && PORTRAITS_AI[fid]) return PORTRAITS_AI[fid];
  return PORTRAITS[fid];
}

function pimg(fid,size){ var s=size||40; var d=portraitOf(fid);
  return d? '<img class="portrait" src="'+d+'" style="width:'+s+'px;height:'+s+'px">' : '';
}

  '**土地、金币、以及握剑的人**。\n' +
  '你将执掌其中一个王庭，从一座城、一支残军开始——' +
  '开垦荒田、征收商税、招募佣兵、联姻结盟，' +
  '然后在某个春天，把王旗插到邻国的城头。\n\n' +
  '四百年的战争即将开始。愿你戴得稳那顶王冠。';

/* =====================================================================
   引擎：状态、地图关系、内政、战斗、AI、事件
   ===================================================================== */

var G = null;                      // 全局游戏状态
var PMAP = {};                     // 省份静态数据
var ADJ = {};                      // 邻接表
var GTABLE = {};                   // 武将表

function $(id){ return document.getElementById(id); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function buildStatic(){
  PMAP = {}; ADJ = {}; GTABLE = {};
  for (var i=0;i<PROVINCES.length;i++){
    var p = PROVINCES[i];
    PMAP[p[0]] = {id:p[0],name:p[1],lon:p[2],lat:p[3],terrain:p[4],agri0:p[5],trade0:p[6],fort0:p[7],owner0:p[8]};
    ADJ[p[0]] = [];
  }
  buildGeo();                     // 地理生成：栅格领地 + 邻接 + 质心
  for (var g=0;g<GENERALS.length;g++){
    var G0=GENERALS[g];
    GTABLE[G0[0]] = {name:G0[0],faction:G0[1],lead:G0[2],war:G0[3],int:G0[4],pol:G0[5],skill:G0[6]||''};
  }
}

/* --------- 状态创建 --------- */
function newState(fid){
  var st = {
    player:fid, turn:1, year:1066, season:0,
    gold:420, prestige:10, ap:6, maxAp:6,
    provs:{}, facs:{}, pool:{}, log:[], over:false, result:'',
    sel:null, moveFrom:null, evCd:3, usedActions:{}
  };
  var i,id;
  for (i=0;i<PROVINCES.length;i++){
    id = PROVINCES[i][0];
    var pm = PMAP[id];
    st.provs[id] = {
      id:id, name:pm.name, terrain:pm.terrain,
      owner:pm.owner0, agri:pm.agri0, trade:pm.trade0, fort:pm.fort0,
      loyalty:65, troops:0, gen:null, siege:0
    };
  }
  for (var f in FACTIONS){
    st.facs[f] = {id:f, gold:300, prestige:8, alive:true, rel:{}, war:{}, ally:{}, aggr:FACTIONS[f].aggr||0.6};
    st.pool[f] = [];
  }
  // 将领分配到各省
  var byFac = {};
  for (var gn in GTABLE){
    var g = GTABLE[gn];
    (byFac[g.faction] = byFac[g.faction]||[]).push(gn);
  }
  for (var fc in st.facs){
    var list = byFac[fc]||[];
    var provs = provsOf(st, fc);
    for (i=0;i<provs.length;i++){
      if (list.length){
        var pick = 0; // 统率最高者先守首都
        list.sort(function(x,y){ return GTABLE[y].lead - GTABLE[x].lead; });
        st.provs[provs[i]].gen = list.shift();
      }
      st.provs[provs[i]].troops = ri(600,1100) + (provs[i]===FACTIONS[fc].capital?300:0);
      if (provs[i]===FACTIONS[fc].capital) st.provs[provs[i]].fort += 10;
    }
    st.pool[fc] = list;            // 剩余武将在朝中待命
  }
  // 让大国稍强
  var big = ['hre','byzantium','france','england'];
  for (i=0;i<big.length;i++){ if (st.facs[big[i]]) st.facs[big[i]].gold += 200; }
  return st;
}

function provsOf(st, fid){
  var out=[];
  for (var id in st.provs) if (st.provs[id].owner===fid) out.push(id);
  return out;
}
function totalTroops(st, fid){
  var t=0, ps=provsOf(st,fid);
  for (var i=0;i<ps.length;i++) t += st.provs[ps[i]].troops;
  return Math.round(t);
}
function isAlive(st, fid){ return st.facs[fid] && st.facs[fid].alive && provsOf(st,fid).length>0; }

/* --------- 关系与外交 --------- */
function rel(st,a,b){ return (st.facs[a].rel[b]||0); }
function setRel(st,a,b,v){
  v = clamp(Math.round(v),-100,100);
  st.facs[a].rel[b]=v;
  if (st.facs[b]) st.facs[b].rel[a]=v;
}
function atWar(st,a,b){ return !!(st.facs[a].war[b] || st.facs[b].war[a]); }
function setWar(st,a,b,on){
  st.facs[a].war[b]=on; if (st.facs[b]) st.facs[b].war[a]=on;
  if (on) setRel(st,a,b,Math.min(rel(st,a,b),-60));
}

/* --------- 战斗 --------- */
function terrainMod(t){
  if (t==='mountain') return {def:1.30, atk:0.85, name:'山地'};
  if (t==='hills')    return {def:1.15, atk:0.95, name:'丘陵'};
  if (t==='forest')   return {def:1.18, atk:0.92, name:'森林'};
  if (t==='desert')   return {def:1.05, atk:0.90, name:'沙漠'};
  if (t==='coast')    return {def:1.05, atk:1.00, name:'海岸'};
  return {def:1.00, atk:1.00, name:'平原'};
}
function genPower(name, kind){
  if (!name || !GTABLE[name]) return {lead:50,war:50,int:50,skill:''};
  return GTABLE[name];
}
function armyPower(st, pid, side){
  var p = st.provs[pid], f = p.owner, F = FACTIONS[f];
  var g = genPower(p.gen);
  var tm = terrainMod(p.terrain);
  var base = (side==='atk') ? p.troops*0.8 : p.troops;
  var lead = g.lead/100;                  // 统率加成
  var morale = 0.7 + p.loyalty/200;       // 民心影响士气
  var mult = 1 + lead*0.35;
  if (side==='def'){
    mult *= tm.def;
    mult *= 1 + p.fort/250;               // 城防
    if (f==='byzantium') mult *= 1.20;
    if (st && f===st.player) mult *= 1.30;      // 你的部队在家门口更顽强
    if (f==='papal') mult *= 1.15;
    if (f==='scotland' && (p.id==='scotland')) mult *= 1.25;
    if (f==='hungary') mult *= 1.07;
  } else {
    mult *= tm.atk;
    if (f==='england') mult *= 1.10;
    if (f==='hre') mult *= 1.10;
    if (f==='poland') mult *= 1.08;
    if (f==='ottoman') mult *= 1.10;
  }
  if (F && F.trait) { /* 特性在下面单独处理 */ }
  return Math.round(base * mult * morale);
}

function runBattle(st, fromId, toId, verbose){
  var A = st.provs[fromId], D = st.provs[toId];
  var af = A.owner, df = D.owner;
  var lines = [];
  var tmA = terrainMod(A.terrain), tmD = terrainMod(D.terrain);
  var ga = genPower(A.gen), gd = genPower(D.gen);
  var att = armyPower(st, fromId, 'atk');
  var def = armyPower(st, toId, 'def');
  // 特性
  if (af==='england' && A.gen && A.gen.indexOf('亨利五世')>=0) att = Math.round(att*1.20);
  if (af==='castile' && df==='granada') att = Math.round(att*1.20);
  if (af==='hre' && A.gen && A.gen.indexOf('腓特烈一世')>=0) att = Math.round(att*1.15);

  lines.push('⚔ ' + FACTIONS[af].name + ' 麾下 ' + (A.gen||'无名之将') + ' 自 ' + A.name +
             ' 进军 ' + D.name + '（' + tmD.name + '）');
  lines.push('  出击兵力 ' + Math.round(A.troops*0.8) + '（留 ' + Math.round(A.troops*0.2) + ' 守家） ｜ 守方兵力 ' + D.troops +
             '（城防 ' + Math.round(D.fort) + '，守将 ' + (D.gen||'无') + '）');
  lines.push('  战力评估：攻 ' + att + ' ｜ 守 ' + def);

  var committed = Math.round(A.troops*0.8);      // 留两成守家
  A.troops -= committed;
  var aLeft = committed, dLeft = D.troops;
  var ratio = att / Math.max(1, def);
  var rounds = 0;
  while (aLeft > 20 && dLeft > 20 && rounds < 6){
    rounds++;
    var aHit = ratio * rnd(0.75,1.25) * 0.16;
    var dHit = (def/Math.max(1,att)) * rnd(0.7,1.2) * 0.16;
    var dLoss = Math.max(15, Math.round(aLeft * aHit));
    var aLoss = Math.max(15, Math.round(dLeft * dHit));
    dLeft -= dLoss; aLeft -= aLoss;
    if (aLeft<0) aLeft=0; if (dLeft<0) dLeft=0;
    if (verbose || rounds<=2)
      lines.push('  第' + rounds + '阵：攻方折损 ' + aLoss + '，守方折损 ' + dLoss +
                 '（余 ' + aLeft + ' / ' + dLeft + '）');
  }
  var win = (dLeft <= 20 && aLeft > dLeft) || (aLeft > dLeft*1.4);
  lines.push(win ? '  ▶ 守军崩溃，' + D.name + ' 的城门被打开。' : '  ▶ 攻势受挫，攻方退回 ' + A.name + '。');
  return {win:win, aLeft:Math.max(0,aLeft), dLeft:Math.max(0,dLeft), lines:lines,
          attName:A.gen, defName:D.gen, af:af, df:df, from:fromId, to:toId};
}

function applyBattle(st, r){
  var A = st.provs[r.from], D = st.provs[r.to];
  if (r.win){
    var spoil = Math.round(D.trade*3 + D.agri*2);
    st.facs[r.af].gold += spoil;
    D.owner = r.af;
    D.troops = Math.round(r.aLeft * 0.85);
    D.fort = Math.max(10, Math.round(D.fort*0.6));
    D.loyalty = clamp(D.loyalty-30, 5, 100);
    D.siege = 0;
    // 守将：被俘或战死
    if (D.gen){
      var gname = D.gen;
      if (Math.random()<0.5){
        st.pool[r.df] = st.pool[r.df]||[];
        // 半数为国捐躯，半数为新主效力
        if (Math.random()<0.5){ st.pool[r.af].push(gname); r.genMsg='俘获了 '+gname+'，他宣誓效忠。'; }
        else r.genMsg = gname + ' 战死于城头。';
        if (r.genMsg.indexOf('战死')>=0){ /* 阵亡则移除 */ }
      } else { r.genMsg = gname + ' 突围而走。'; st.pool[r.df].push(gname); }
      D.gen = null;
    }
    A.gen = null;                 // 主将随军入城，后方留少量守军
    D.gen = r.attName || null;
    st.facs[r.df].alive = isAlive(st, r.df);
    setRel(st, r.af, r.df, rel(st,r.af,r.df)-15);
  } else {
    A.troops = Math.max(50, A.troops + Math.round(r.aLeft*0.7));
    D.troops = Math.max(50, Math.round(r.dLeft*0.85));
    A.loyalty = clamp(A.loyalty-5,5,100);
    st.facs[r.af].prestige = Math.max(0, st.facs[r.af].prestige-1);
  }
  return r;
}

/* --------- 玩家行动 --------- */
function capFid(st){ return st.player; }
function cost(st, base){
  var c = base;
  if (st.player==='france') c = Math.round(c*0.8);
  if (st.player==='byzantium' && base>=80) c = Math.round(c*0.7);
  return c;
}
function spend(st, g){ st.gold -= g; if (st.gold<0) st.gold=0; }

function act(st, kind, pid){
  var p = st.provs[pid];
  if (!p || p.owner!==st.player) return {ok:false,msg:'这不是你的领地。'};
  if (st.ap<=0) return {ok:false,msg:'本回合的政令已用尽。'};
  var F = FACTIONS[st.player];
  if (kind==='farm'){
    var c = cost(st,70); if (st.gold<c) return {ok:false,msg:'金库不足。'};
    spend(st,c); p.agri = clamp(p.agri+ri(5,8),0,100); st.ap--;
    return {ok:true,msg:'开垦 ' + p.name + '：农田 +6 左右。'};
  }
  if (kind==='trade'){
    var c2 = cost(st,70); if (st.gold<c2) return {ok:false,msg:'金库不足。'};
    spend(st,c2); p.trade = clamp(p.trade+ri(5,8),0,100); st.ap--;
    return {ok:true,msg:'通商 ' + p.name + '：市集繁荣。'};
  }
  if (kind==='loyal'){
    var c3 = cost(st,50); if (st.gold<c3) return {ok:false,msg:'金库不足。'};
    spend(st,c3); p.loyalty = clamp(p.loyalty+ri(6,10),0,100); st.ap--;
    return {ok:true,msg:'巡察 ' + p.name + '：民心安定。'};
  }
  if (kind==='fort'){
    var c4 = cost(st,90); if (st.gold<c4) return {ok:false,msg:'金库不足。'};
    spend(st,c4); p.fort = clamp(p.fort+ri(6,9),0,120); st.ap--;
    return {ok:true,msg:'修筑 ' + p.name + '：城墙加厚。'};
  }
  if (kind==='recruit'){
    var c5 = cost(st,100); if (st.gold<c5) return {ok:false,msg:'金库不足。'};
    spend(st,c5);
    var g = genPower(p.gen);
    var add = Math.round(ri(520,820) * (1 + g.lead/300));
    if (st.player==='kiev') add = Math.round(add*1.2);
    p.troops += add; p.loyalty = clamp(p.loyalty-3,5,100); st.ap--;
    return {ok:true,msg:'在 ' + p.name + ' 征兵 ' + add + ' 人。'};
  }
  if (kind==='assign'){
    var pool = st.pool[st.player]||[];
    if (!pool.length) return {ok:false,msg:'朝中已无待命之将。'};
    var c6 = cost(st,60); if (st.gold<c6) return {ok:false,msg:'金库不足。'};
    pool.sort(function(a,b){ return GTABLE[b].lead - GTABLE[a].lead; });
    var pick = pool.shift();
    if (p.gen) st.pool[st.player].push(p.gen);
    p.gen = pick; spend(st,c6); st.ap--;
    return {ok:true,msg:'任命 ' + pick + ' 镇守 ' + p.name + '（统率 ' + GTABLE[pick].lead + '）。'};
  }
  return {ok:false,msg:'未知指令。'};
}

/* --------- 收入结算 --------- */
function income(st, fid){
  var ps = provsOf(st, fid), gold=0, upkeep=0;
  for (var i=0;i<ps.length;i++){
    var p = st.provs[ps[i]];
    var g = (p.trade*0.62 + p.agri*0.48) * (0.55 + p.loyalty/220);
    if (fid==='venice') g *= 1.25;
    if (fid==='aragon') g *= 1.12;
    if (fid==='denmark' && p.id==='denmark') g *= 1.2;
    if (fid==='papal') g += 25;
    gold += g + 26;
    upkeep += p.troops*0.025;
  }
  if (fid==='kiev') upkeep *= 0.85;
  return {gold:Math.round(gold), upkeep:Math.round(upkeep), net:Math.round(gold-upkeep)};
}
function collect(st, fid){
  var inc = income(st, fid);
  var f = st.facs[fid];
  f.gold += inc.net;
  if (f.gold < 0){
    // 欠饷：兵力流失、民心下降
    var ps = provsOf(st, fid);
    for (var i=0;i<ps.length;i++){
      st.provs[ps[i]].troops = Math.round(st.provs[ps[i]].troops*0.94);
      st.provs[ps[i]].loyalty = clamp(st.provs[ps[i]].loyalty-4,5,100);
    }
    f.gold = 0;
    return inc;
  }
  // 威望增长
  var ps2 = provsOf(st, fid);
  f.prestige += Math.round(ps2.length*0.35) + (fid==='papal'?1:0) + (fid==='kiev'?0:0);
  return inc;
}

/* --------- AI --------- */
function aiTurn(st, fid){
  if (!isAlive(st, fid)) return;
  var my = provsOf(st, fid), i, j;
  var F = FACTIONS[fid];
  var myTroops = totalTroops(st, fid);
  var f = st.facs[fid];
  f.gold += Math.round(my.length*6);

  // 1) 寻找猎物：相邻的敌方弱城
  var targets = [];
  for (i=0;i<my.length;i++){
    var from = st.provs[my[i]];
    if (from.troops < 500) continue;
    var nb = ADJ[my[i]];
    for (j=0;j<nb.length;j++){
      var to = st.provs[nb[j]];
      if (to.owner===fid) continue;
      if (f.ally[to.owner]) continue;
      var defP = armyPower(st, to.id, 'def');
      var attP = armyPower(st, from.id, 'atk');
      var score = attP / Math.max(1,defP);
      if (to.owner==='papal' && CATHOLIC.indexOf(fid)>=0) score -= 0.75;   // 怕被绝罚
      if (score > (1.30 - f.aggr*0.22)) targets.push({from:from.id,to:to.id,score:score});
    }
  }
  targets.sort(function(a,b){ return b.score-a.score; });
  var launched = false;
  f.atkCd = (f.atkCd || 0) - 1;                       // 每两回合才能发动一次进攻
  if (f.gold < 120) { /* 国库空虚，本年只守不攻 */ }
  else
  var canHit = true;
  if (targets.length && st.provs[targets[0].to].owner === st.player && (st.aiHitsOnPlayer||0) >= 2) canHit = false;
  if (canHit && f.atkCd <= 0 && targets.length && Math.random() < 0.55 + f.aggr*0.3){
    var t = targets[0];
    var tgtOwner = st.provs[t.to].owner;
    if (!atWar(st, fid, tgtOwner)) setWar(st, fid, tgtOwner, true);
    var r = runBattle(st, t.from, t.to, false);
    applyBattle(st, r);
    if (tgtOwner === st.player) st.aiHitsOnPlayer = (st.aiHitsOnPlayer||0) + 1;
    if (fid!==st.player && st.provs[t.to].owner===fid && my.length>=2){
      st.log.push({c:'bad', m:'⚠ ' + F.name + ' 攻陷了 ' + st.provs[t.to].name + '！'});
    }
    launched = true;
    f.atkCd = 2;
  }
  // 2) 发展
  if (!launched || Math.random()<0.5){
    // 挑一块主力地集中养兵，否则各国都停在均势、整个大陆会僵死
    var main = my[0], k;
    for (k=1;k<my.length;k++) if (st.provs[my[k]].troops > st.provs[main].troops) main = my[k];
    var budget = Math.min(f.gold, 110 + my.length*28), spent = 0;
    for (i=0;i<my.length;i++){
      var p = st.provs[my[i]], isMain = (p.id===main);
      if (budget - spent < 110) break;
      if (p.troops < (isMain?2600:800)){ p.troops += (isMain?460:320); spent += (isMain?140:100); }
      else if (p.fort < (isMain?90:70)){ p.fort += 6; spent += 80; }
      else if (p.agri < 85){ p.agri += 5; spent += 65; }
      else if (p.trade < 85){ p.trade += 5; spent += 65; }
      else if (p.loyalty < 85){ p.loyalty += 6; spent += 45; }
    }
    f.gold = Math.max(0, f.gold - spent);
  }
  // 3) 外交：弱者求和
  if (my.length <= 2 && Math.random()<0.4){
    for (var other in st.facs){
      if (other===fid || !isAlive(st,other)) continue;
      if (atWar(st,fid,other) && rel(st,fid,other) < -50){
        setWar(st,fid,other,false); setRel(st,fid,other,-10);
        if (my.length<=2) st.log.push({c:'', m:'· ' + F.name + ' 遣使求和。'});
        break;
      }
    }
  }
}

/* --------- 事件 --------- */
function fireEvent(st){
  var ev = EVENTS[ri(0,EVENTS.length-1)];
  var ctx = { gold:st.gold, prestige:st.prestige,
              modTrade:0, modTroops:0, loyaltyBonus:0, troopsBonus:0, newGeneral:false,
              troops: totalTroops(st, st.player) };
  var idx = ri(0, ev.ch.length-1);
  var msg = ev.ch[idx].f(ctx);
  // 应用
  st.gold = Math.max(0, Math.round(ctx.gold));
  st.prestige = Math.max(0, Math.round(ctx.prestige));
  var ps = provsOf(st, st.player), i;
  for (i=0;i<ps.length;i++){
    var p = st.provs[ps[i]];
    if (ctx.modTrade) p.trade = clamp(p.trade+ctx.modTrade,5,100);
    if (ctx.modTroops) p.troops = Math.max(60, Math.round(p.troops*(1+ctx.modTroops)));
    if (ctx.loyaltyBonus) p.loyalty = clamp(p.loyalty+ctx.loyaltyBonus,5,100);
  }
  if (ctx.troopsBonus){
    var cap = FACTIONS[st.player].capital;
    if (st.provs[cap] && st.provs[cap].owner===st.player) st.provs[cap].troops += ctx.troopsBonus;
    else if (ps.length) st.provs[ps[0]].troops += ctx.troopsBonus;
  }
  if (ctx.newGeneral){
    var poolNames = [];
    for (var gn in GTABLE) if (GTABLE[gn].faction===st.player) poolNames.push(gn);
    var avail = [];
    for (i=0;i<poolNames.length;i++) if ((st.pool[st.player]||[]).indexOf(poolNames[i])<0) avail.push(poolNames[i]);
    if (avail.length){ var pick = avail[ri(0,avail.length-1)]; st.pool[st.player].push(pick); msg += '（'+pick+'）'; }
    else { st.prestige += 5; msg += '（朝中已无名将，威望 +5）'; }
  }
  return {title:ev.t, text:ev.txt, msg:msg, choices:ev.ch.map(function(c){return c.l;}), auto:true};
}

/* --------- 回合推进 --------- */
function endTurn(st){
  var i, all = [];
  for (var f in st.facs) if (isAlive(st,f)) all.push(f);
  // AI 先动（玩家在最后，形成"你先动、敌人回应"的节奏）
  st.aiHitsOnPlayer = 0;                       // 本回合 AI 对玩家的进攻次数上限
  for (i=0;i<all.length;i++){ if (all[i]!==st.player) aiTurn(st, all[i]); }
  // 收入
  for (i=0;i<all.length;i++) collect(st, all[i]);
  // 事件
  var evInfo = null;
  st.evCd--;
  if (st.evCd<=0 && isAlive(st, st.player)){ evInfo = pickEvent(st); st.evCd = ri(2,3); }
  // 新回合
  st.turn++; st.ap = st.maxAp; st.usedActions = {};
  if (st.turn%4===1){ st.year += 1; }
  // 民心自然回升
  var ps = provsOf(st, st.player);
  for (i=0;i<ps.length;i++) st.provs[ps[i]].loyalty = clamp(st.provs[ps[i]].loyalty+1,5,100);
  // 胜负
  var mine = provsOf(st, st.player).length;
  var total = PROVINCES.length;
  if (mine===0){ st.over=true; st.result='lose'; }
  else if (mine/total >= 0.45){ st.over=true; st.result='win'; }
  return evInfo;
}

function checkRivals(st){
  var best=null, bn=0;
  for (var f in st.facs){
    if (f===st.player || !isAlive(st,f)) continue;
    var n = provsOf(st,f).length;
    if (n>bn){ bn=n; best=f; }
  }
  return best? {id:best, n:bn} : null;
}

function nearestEnemy(st, pid){

}

function doPolicy(st, id, pid){
  var list = factionPolicies(st.player), a = null, i;
  for (i=0;i<list.length;i++) if (list[i].id===id) a = list[i];
  if (!a) return {ok:false, msg:'这不是本国的国策。'};
  var p = st.provs[pid];
  if (!p || p.owner!==st.player) return {ok:false, msg:'请先点选一块自己的领地。'};
  if (st.ap<=0) return {ok:false, msg:'本回合的政令已用尽。'};
  if (st.usedActions[a.id]) return {ok:false, msg:'「'+a.n+'」本回合已经用过。'};
  if (a.c && st.gold < a.c) return {ok:false, msg:'金库不足（需要 '+a.c+' 金）。'};
  if (a.c) spend(st, a.c);
  st.ap--; st.usedActions[a.id] = true;
  var m = a.f(st, p);
  return {ok:true, msg:'【'+FACTIONS[st.player].name+' · '+a.n+'】'+m};
}

var BARD = (function(){

    else if(kind==='vie')  data=harm(f,dur,sr,STRINGS,0.13,0.3,0.0);
    else if(kind==='organ')data=harm(f,dur,sr,ORGAN,0.35,0.5,0.002);
    else if(kind==='choir')data=harm(f,dur,sr,CHOIR,0.45,0.6,-0.004);
    else if(kind==='str')  data=harm(f,dur,sr,STRINGS,0.22,0.45,0.001);
    else if(kind==='brass')data=harm(f,dur,sr,BRASS,0.08,0.25,0);

      var n=Math.round(0.9*sr), o2=new Float32Array(n);

        var fq=f*(1+0.35*Math.exp(-t2*9));

    if(tr.timp && pbs.indexOf(b)>=0){

        var rollN=Math.round(tr.beats*4);

    }
    if(tr.bells&&tr.bells.length) for(var b3=0;b3<tr.bells.length;b3++){

/* ===== 地图册风格绘制 ===== */
function atlasFill(hex,t){                       /* 把势力色调成地图册的淡彩 */
  var c=hexToRgb(hex);
  return [Math.round(c[0]+(255-c[0])*t), Math.round(c[1]+(255-c[1])*t), Math.round(c[2]+(255-c[2])*t)];
}
function gMount(c,x,y,s,col){
  c.fillStyle=col;
  c.beginPath(); c.moveTo(x-s,y+s*0.7); c.lineTo(x,y-s); c.lineTo(x+s,y+s*0.7); c.closePath(); c.fill();
}
function gTree(c,x,y,s,col){
  c.fillStyle=col;
  c.beginPath(); c.arc(x,y,s*0.75,0,Math.PI*2); c.fill();
}
function drawLine(c,pts,style,width,glow){
  if(pts.length<2) return;
  c.strokeStyle=style; c.lineWidth=width; c.lineJoin='round'; c.lineCap='round';
  c.beginPath();
  for(var i=0;i<pts.length;i++){
    var x=gx(pts[i][0])*(CW/RW), y=gy(pts[i][1])*(CH/RH);
    i?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.stroke();
  if(glow){ c.strokeStyle=glow; c.lineWidth=Math.max(0.5,width*0.34); c.stroke(); }
}
function drawGraticule(ctx){
  var u=CW/744;
  ctx.save();
  ctx.strokeStyle='rgba(70,100,125,.20)'; ctx.lineWidth=0.8*u;
  ctx.font=(9*u).toFixed(1)+'px sans-serif'; ctx.fillStyle='rgba(50,75,95,.75)';
  var lon;
  for(lon=-10; lon<=45; lon+=5){
    var x=gx(lon)*(CW/RW);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke();
    ctx.textAlign='left';
    var txt=(lon===0?'0°':(lon>0? lon+'°E': (-lon)+'°W'));
    ctx.fillText(txt, x+3*u, CH-6*u);
  }
  for(var lat=30; lat<=70; lat+=5){
    var y=gy(lat)*(CH/RH);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke();
    ctx.textAlign='left';
    ctx.fillText(lat+'°N', 4*u, y-3*u);
  }
  ctx.restore();
}
function drawLegend(ctx){
  var u=CW/744, x0=14*u, y0=72*u, w=206*u, rowH=14.5*u;
  var list=Object.keys(FACTIONS).filter(function(f){ return isAlive(G,f); });
  list.sort(function(a,b){ return provsOf(G,b).length-provsOf(G,a).length; });
  if(list.length>17) list=list.slice(0,17);
  var rows=Math.ceil(list.length/2), h=rows*rowH+22*u;
  ctx.fillStyle='rgba(255,255,255,.90)';
  ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='rgba(60,80,100,.75)'; ctx.lineWidth=1*u; ctx.strokeRect(x0,y0,w,h);
  ctx.fillStyle='#22303d'; ctx.font='bold '+(10.5*u).toFixed(1)+'px sans-serif'; ctx.textAlign='left';
  ctx.fillText('图例 · 势力', x0+7*u, y0+13*u);
  ctx.font=(9*u).toFixed(1)+'px sans-serif';
  for(var i=0;i<list.length;i++){
    var col=Math.floor(i/rows), row=i%rows;

    if(nm.length>6) nm=nm.slice(0,6);

  }
}

function drawNorthArrow(ctx){
  var u=CW/744, x=CW-40*u, y=48*u;
  ctx.fillStyle='rgba(255,255,255,.88)';
  ctx.beginPath(); ctx.arc(x,y,22*u,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(60,80,100,.75)'; ctx.lineWidth=1*u; ctx.stroke();
  ctx.fillStyle='#22303d';
  ctx.beginPath(); ctx.moveTo(x,y-16*u); ctx.lineTo(x+6*u,y+8*u); ctx.lineTo(x,y+3*u); ctx.lineTo(x-6*u,y+8*u); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8c1f1f'; ctx.font='bold '+(10*u).toFixed(1)+'px sans-serif'; ctx.textAlign='center';
  ctx.fillText('N', x, y+19*u);
}
function drawMap(){
  var cv=$('map'), ctx=cv.getContext('2d'), i, k, u=CW/744;
  /* 1. 海洋：浅蓝 + 近岸更浅 */
  var g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#b9d6e6'); g.addColorStop(1,'#a7c9dd');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  if(!OFFCAN){ OFFCAN=document.createElement('canvas'); OFFCAN.width=RW; OFFCAN.height=RH; }
  var octx=OFFCAN.getContext('2d'), img=octx.createImageData(RW,RH), d=img.data;
  var SHAL=new Uint8Array(RW*RH);
  for(var ry=0;ry<RH;ry++) for(var rx=0;rx<RW;rx++){
    if(RASTER[ry*RW+rx]>=0) continue;
    var near=false;
    for(var dy3=1;dy3<=2&&!near;dy3++) for(var dx3=-dy3;dx3<=dy3&&!near;dx3++){
      for(var sgn=-1;sgn<=1;sgn+=2){
        var xx=rx+dx3, yy=ry+sgn*dy3;
        if(xx>=0&&yy>=0&&xx<RW&&yy<RH&&RASTER[yy*RW+xx]>=0) near=true;
      }
    }
    SHAL[ry*RW+rx]=near?1:0;
  }
  for(ry=0;ry<RH;ry++) for(rx=0;rx<RW;rx++){
    var v=RASTER[ry*RW+rx], o=(ry*RW+rx)*4, c;
    if(v<0){ c = SHAL[ry*RW+rx] ? [206,229,240] : [176,206,224]; }
    else {
      var pid=PROVINCES[v][0], p=G.provs[pid];
      c=atlasFill(facColor(p.owner),0.30);
      var tm=p.terrain;
      if(tm==='mountain') c=[c[0]*0.94,c[1]*0.94,c[2]*0.95];
      else if(tm==='forest') c=[c[0]*0.94,c[1]*0.98,c[2]*0.93];
      else if(tm==='desert') c=[c[0]*1.03,c[1]*1.0,c[2]*0.9];
      if(G.sel===pid) c=[Math.min(255,c[0]*0.86+30),Math.min(255,c[1]*0.9+26),Math.min(255,c[2]*0.85+24)];
      if(G.moveFrom===pid) c=[Math.min(255,c[0]+30),Math.max(0,c[1]-14),Math.max(0,c[2]-24)];
    }
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(OFFCAN,0,0,RW,RH,0,0,CW,CH);
  /* 2. 省界（细）+ 国界（粗） */
  var cw=CW/RW, chh=CH/RH;
  ctx.beginPath();
  for(ry=0;ry<RH;ry++) for(rx=0;rx<RW;rx++){
    var w=RASTER[ry*RW+rx]; if(w<0) continue;
    var xx2=rx*cw, yy2=ry*chh;
    if(rx+1<RW){ var r1=RASTER[ry*RW+rx+1]; if(r1>=0&&r1!==w){ ctx.moveTo(xx2+cw,yy2); ctx.lineTo(xx2+cw,yy2+chh); } }
    if(ry+1<RH){ var b1=RASTER[(ry+1)*RW+rx]; if(b1>=0&&b1!==w){ ctx.moveTo(xx2,yy2+chh); ctx.lineTo(xx2+cw,yy2+chh); } }
  }
  ctx.strokeStyle='rgba(70,80,90,.55)'; ctx.lineWidth=0.8*u; ctx.stroke();
  ctx.beginPath();
  for(ry=0;ry<RH;ry++) for(rx=0;rx<RW;rx++){
    var w2=RASTER[ry*RW+rx]; if(w2<0) continue;
    var o1=G.provs[PROVINCES[w2][0]].owner, x3=rx*cw, y3=ry*chh;
    if(rx+1<RW){ var r2=RASTER[ry*RW+rx+1];
      if(r2>=0 && G.provs[PROVINCES[r2][0]].owner!==o1){ ctx.moveTo(x3+cw,y3); ctx.lineTo(x3+cw,y3+chh); } }
    if(ry+1<RH){ var b3=RASTER[(ry+1)*RW+rx];
      if(b3>=0 && G.provs[PROVINCES[b3][0]].owner!==o1){ ctx.moveTo(x3,y3+chh); ctx.lineTo(x3+cw,y3+chh); } }
  }
  ctx.strokeStyle='rgba(40,50,60,.9)'; ctx.lineWidth=1.7*u; ctx.stroke();
  /* 3. 海岸线 */
  ctx.beginPath();
  for(ry=0;ry<RH;ry++) for(rx=0;rx<RW;rx++){
    if(RASTER[ry*RW+rx]<0) continue;
    var x4=rx*cw, y4=ry*chh;
    if(rx+1>=RW||RASTER[ry*RW+rx+1]<0){ ctx.moveTo(x4+cw,y4); ctx.lineTo(x4+cw,y4+chh); }
    if(ry+1>=RH||RASTER[(ry+1)*RW+rx]<0){ ctx.moveTo(x4,y4+chh); ctx.lineTo(x4+cw,y4+chh); }
    if(rx-1<0||RASTER[ry*RW+rx-1]<0){ ctx.moveTo(x4,y4); ctx.lineTo(x4,y4+chh); }
    if(ry-1<0||RASTER[(ry-1)*RW+rx]<0){ ctx.moveTo(x4,y4); ctx.lineTo(x4+cw,y4); }
  }
  ctx.strokeStyle='#4c6a80'; ctx.lineWidth=1.2*u; ctx.stroke();
  /* 4. 经纬网 */
  drawGraticule(ctx);
  /* 5. 河流 */
  for(i=0;i<RIVERS.length;i++) drawLine(ctx,RIVERS[i],'rgba(90,150,200,.9)',1.5*u,'rgba(255,255,255,.35)');
  /* 6. 山脉 / 森林 */
  for(i=0;i<RANGES.length;i++){
    var rg=RANGES[i];
    for(k=0;k<rg.length-1;k++){
      var ax=gx(rg[k][0])*(CW/RW), ay=gy(rg[k][1])*(CH/RH);
      var bx=gx(rg[k+1][0])*(CW/RW), by=gy(rg[k+1][1])*(CH/RH);
      var seg=Math.max(1,Math.round(Math.hypot(bx-ax,by-ay)/11));
      for(var s2=0;s2<seg;s2++){
        var tt=s2/seg;
        gMount(ctx,ax+(bx-ax)*tt+((s2%3)-1)*2, ay+(by-ay)*tt+((k%2)?2:-2), 4.6*u, 'rgba(120,112,100,.85)');
      }
    }
  }
  for(i=0;i<PROVINCES.length;i++){
    var pid3=PROVINCES[i][0], p3=G.provs[pid3], ce3=CENTROID[pid3];
    if(!ce3||p3.terrain!=='forest') continue;
    var rad3=Math.sqrt(ce3.area/Math.PI)*(CW/RW);
    var want=Math.min(14,Math.max(3,Math.round(ce3.area/300)));
    for(k=0;k<want;k++){
      var ang=k*2.399+i, rr=rad3*(0.25+0.6*((k*37%17)/17));
      gTree(ctx, gx(PROVINCES[i][2])*(CW/RW)+Math.cos(ang)*rr*1.1,
                gy(PROVINCES[i][3])*(CH/RH)+Math.sin(ang)*rr*0.8, 2.6*u, 'rgba(96,140,96,.55)');
    }
  }
  /* 7. 国名大字（地图册特征） */
  var byOwner={};
  for(i=0;i<PROVINCES.length;i++){
    var pidO=PROVINCES[i][0], ceO=CENTROID[pidO];
    if(!ceO) continue;
    var own=G.provs[pidO].owner;
    if(!byOwner[own]) byOwner[own]={x:0,y:0,a:0};
    byOwner[own].x+=gx(PROVINCES[i][2])*(CW/RW)*ceO.area;
    byOwner[own].y+=gy(PROVINCES[i][3])*(CH/RH)*ceO.area;
    byOwner[own].a+=ceO.area;
  }
  ctx.textAlign='center';
  for(var f2 in byOwner){
    var o2=byOwner[f2];
    if(!o2.a || provsOf(G,f2).length<2) continue;
    var cx2=o2.x/o2.a, cy2=o2.y/o2.a;
    ctx.font='bold '+(15*u).toFixed(1)+'px "Noto Serif SC",serif';
    ctx.lineWidth=3.2*u; ctx.strokeStyle='rgba(255,255,255,.72)';
    var nm2=FACTIONS[f2].name.replace(/王国|帝国|共和国|公国|伯国|联盟|诸部|埃米尔国|苏丹国|王朝|联合/g,'');
    ctx.strokeText(nm2,cx2,cy2); ctx.fillStyle='rgba(35,48,60,.42)'; ctx.fillText(nm2,cx2,cy2);
  }
  /* 8. 省名 / 兵力 / 守将（带避让） */
  var placed=[];
  for(i=0;i<PROVINCES.length;i++){
    var pid2=PROVINCES[i][0], ce=CENTROID[pid2];
    if(!ce) continue;
    var p2=G.provs[pid2], x=gx(PROVINCES[i][2])*(CW/RW), y=gy(PROVINCES[i][3])*(CH/RH);
    var rad=Math.sqrt(ce.area/Math.PI)*(CW/RW);
    ctx.fillStyle='#243444'; ctx.beginPath(); ctx.arc(x,y,2.1*u,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=0.8*u; ctx.stroke();
    var must=(pid2===G.player||pid2===G.sel||(FACTIONS[p2.owner]&&FACTIONS[p2.owner].capital===pid2));
    if(rad<11 && !must) continue;
    var w4=PROVINCES[i][1].length*(10.5*u)+8*u, box=[x-w4/2,y+3*u,w4,13*u];
    var hit=false;
    for(k=0;k<placed.length;k++){
      var q=placed[k];
      if(!(box[0]>q[0]+q[2]||box[0]+box[2]<q[0]||box[1]>q[1]+q[3]||box[1]+box[3]<q[1])){ hit=true; break; }
    }
    if(hit && !must) continue;
    placed.push(box);
    ctx.font='bold '+(10.5*u).toFixed(1)+'px sans-serif';
    ctx.lineWidth=3*u; ctx.strokeStyle='rgba(255,255,255,.92)';
    ctx.strokeText(PROVINCES[i][1], x, y+12*u);
    ctx.fillStyle='#1b2836'; ctx.fillText(PROVINCES[i][1], x, y+12*u);
    if(rad>=15){
      ctx.font=(8.5*u).toFixed(1)+'px sans-serif';
      ctx.lineWidth=2.6*u; ctx.strokeStyle='rgba(255,255,255,.92)';
      var t4='⚔'+Math.round(p2.troops);
      ctx.strokeText(t4,x,y+22*u); ctx.fillStyle='#33465a'; ctx.fillText(t4,x,y+22*u);
    }
  }
  /* 9. 海名 */
  ctx.font='italic '+(11*u).toFixed(1)+'px "Noto Serif SC",serif';
  ctx.fillStyle='rgba(56,96,124,.7)';
  for(i=0;i<SEA_LABELS.length;i++)
    ctx.fillText(SEA_LABELS[i][0], gx(SEA_LABELS[i][1])*(CW/RW), gy(SEA_LABELS[i][2])*(CH/RH));
  /* 10. 图例 / 标题 / 比例尺 / 指北针 / 图框 */
  drawLegend(ctx); drawTitleBlock(ctx); drawScaleBar(ctx); drawNorthArrow(ctx);
  ctx.strokeStyle='#3d5468'; ctx.lineWidth=2*u; ctx.strokeRect(1*u,1*u,CW-2*u,CH-2*u);
  ctx.strokeStyle='rgba(61,84,104,.45)'; ctx.lineWidth=0.8*u; ctx.strokeRect(4*u,4*u,CW-8*u,CH-8*u);
}

/* --------- 侧栏 --------- */
function stat(k, v, pct){
  return '<div class="pv-stat"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
    (pct!=null ? '<div class="bar"><i style="width:' + clamp(pct,0,100) + '%"></i></div>' : '') + '</div>';
}
function renderSide(){
  var st = G, box = $('prov-panel'), ab = $('action-panel'), pm, p;
  if (!st.sel){ pm = PMAP[FACTIONS[st.player].capital]; p = st.provs[pm.id]; }
  else { pm = PMAP[st.sel]; p = st.provs[st.sel]; }
  var mine = (p.owner===st.player);
  var inc = income(st, st.player);
  var html = '';
  html += '<div class="pv-title"><span class="flag" style="display:inline-block;width:12px;height:12px;border-radius:2px;background:' +
          facColor(p.owner) + '"></span>' + pm.name + '</div>';
  if (p.owner === st.player){
    html += '<div class="port-row">' + pimg(st.player,52) + '<div><b>' + FACTIONS[st.player].name + '</b><small>' + FACTIONS[st.player].lord + ' 在位</small></div></div>';
  } else {
    html += '<div class="port-row">' + pimg(p.owner,52) + '<div><b>' + FACTIONS[p.owner].name + '</b><small>' + FACTIONS[p.owner].lord + '</small></div></div>';
  }
  html += '<div class="pv-owner">' + FACTIONS[p.owner].name +
          (FACTIONS[p.owner] && FACTIONS[p.owner].capital===pm.id ? ' · 王庭所在' : '') +
          '　·　' + terrainMod(pm.terrain).name + '</div>';
  html += '<div class="pv-grid">' +
    stat('农业', Math.round(p.agri), p.agri) +
    stat('商业', Math.round(p.trade), p.trade) +
    stat('城防', Math.round(p.fort), p.fort) +
    stat('民心', Math.round(p.loyalty), p.loyalty) +
    stat('驻军', Math.round(p.troops), null) +
    stat('守将', p.gen || '—', null) +
    '</div>';
  html += '<div class="hint">本势力每回合收入 <b style="color:#f2d98b">' + inc.net + '</b> 金（毛收入 ' + inc.gold + ' − 军饷 ' + inc.upkeep + '）</div>';
  box.innerHTML = html;

  var btn = '';
  if (!mine){
    btn += '<div class="hint">这是 <b>' + FACTIONS[p.owner].name + '</b> 的领地。' +
           (atWar(st, st.player, p.owner) ? '你们<b style="color:#e08b6a">正在交战</b>。' : '目前尚未交战（关系 ' + rel(st,st.player,p.owner) + '）。') +
           '</div>';
    if (st.moveFrom && ADJ[st.moveFrom].indexOf(p.id)>=0){
      btn += '<button class="act-btn danger" data-a="attack">进军此地<small>从 ' + PMAP[st.moveFrom].name + ' 发起进攻</small></button>';
    } else {
      btn += '<div class="hint">要进攻它：先点选自己的相邻领地 → 再点「出征此地」。</div>';
    }
    btn += '<button class="act-btn" data-a="cancel">取消选择</button>';
    ab.innerHTML = btn; bindActions(); return;
  }
  if (st.moveFrom){
    btn += '<div class="hint" style="color:#ff9c6b">正在从 <b>' + PMAP[st.moveFrom].name + '</b> 出征：请在地图上点选相邻目标（自己的领地则调兵，敌国则开战）。</div>';
    btn += '<button class="act-btn" data-a="cancel">取消出征</button>';
    ab.innerHTML = btn; bindActions(); return;
  }
  btn += '<div class="hint">通用政令（每项消耗 1 点政令）</div>';
  btn += actBtn('farm','开垦农田', cost(st,70), '农业 +6') +
         actBtn('trade','开通商路', cost(st,70), '商业 +6') +
         actBtn('loyal','巡察民情', cost(st,50), '民心 +8') +
         actBtn('fort','修筑城防', cost(st,90), '城防 +7') +
         actBtn('recruit','征募新兵', cost(st,100), '+600 兵，民心 -3') +
         actBtn('assign','任命守将', cost(st,60), (st.pool[st.player]||[]).length + ' 位将领待命');
  btn += '<div class="hint" style="color:#c9a227">国策 · ' + FACTIONS[st.player].name + '（每回合各一次）</div>';
  var pol = factionPolicies(st.player);
  for (var i=0;i<pol.length;i++){
    var a = pol[i];
    btn += '<button class="act-btn' + (st.usedActions[a.id]?' on':'') + '" data-pol="' + a.id + '"' +
           (st.usedActions[a.id]?' disabled':'') + '>' + a.n +
           '<span class="cost">' + (a.c? a.c+'金':'免费') + '</span><small>' + a.d + '</small></button>';
  }
  btn += '<div class="hint">军事</div>';
  btn += '<button class="act-btn danger" data-a="move"' + (p.troops<80?' disabled':'') + '>出征此地' +
         '<small>以 ' + pm.name + ' 为基地，向相邻领地进军（兵力 ' + Math.round(p.troops) + '）</small></button>';
  ab.innerHTML = btn;
  bindActions();
}
function actBtn(k, n, c, d){
  return '<button class="act-btn" data-a="' + k + '">' + n +
         '<span class="cost">' + c + '金</span><small>' + d + '</small></button>';
}
function bindActions(){
  var ab = $('action-panel');
  var bs = ab.querySelectorAll('button');
  for (var i=0;i<bs.length;i++){
    bs[i].onclick = function(){
      var a = this.getAttribute('data-a'), pl = this.getAttribute('data-pol');
      if (pl){ var r = doPolicy(G, pl, G.sel); toast(r); }
      else if (a==='move'){ G.moveFrom = G.sel; log(G,'整军待发：' + PMAP[G.sel].name + ' 的军队等待进军命令。','hl'); refresh(); }
      else if (a==='cancel'){ G.moveFrom = null; refresh(); }
      else if (a==='attack'){ var r2 = doAttack(G.moveFrom, G.sel); refresh(); }
      else { var r3 = act(G, a, G.sel); toast(r3); }
    };
  }
}
function toast(r){
  if (!r) return;
  log(G, r.msg, r.ok? 'good':'bad');
  if (!r.ok) flash();
  refresh();
}
function flash(){
  var el = $('action-panel'); if (!el) return;
  el.style.transition='none'; el.style.background='rgba(140,31,31,.35)';
  setTimeout(function(){ el.style.transition='background .5s'; el.style.background=''; }, 40);
}

/* --------- 地图点击 --------- */
function onMapClick(e){
  var cv = $('map'), r = cv.getBoundingClientRect();
  var x = (e.clientX - r.left) * (cv.width / r.width);
  var y = (e.clientY - r.top) * (cv.height / r.height);
  var rx = Math.floor(x / (CW/RW)), ry = Math.floor(y / (CH/RH));
  if (rx<0||ry<0||rx>=RW||ry>=RH) return;
  var v = RASTER[ry*RW+rx];
  if (v < 0) return;                       // 海洋或荒野
  var hit = PROVINCES[v][0];
  if (G.moveFrom && G.moveFrom!==hit && ADJ[G.moveFrom].indexOf(hit)>=0){
    doAttack(G.moveFrom, hit); G.moveFrom = null; refresh(); return;
  }
  if (G.moveFrom && ADJ[G.moveFrom].indexOf(hit)<0 && G.moveFrom!==hit){
    log(G,'这两块领地并不相邻。','bad'); flash();
  }
  G.sel = hit; refresh();
}

/* --------- 进攻 / 调兵 --------- */
function doAttack(fromId, toId){
  var st = G, A = st.provs[fromId], D = st.provs[toId];
  if (!A || !D) return;
  if (A.owner!==st.player){ log(st,'只能从自己的领地出兵。','bad'); return; }
  if (A.troops < 60){ log(st,'兵力太少，无法出征。','bad'); return; }
  if (D.owner===st.player){
    var send = Math.round(A.troops*0.7);
    D.troops += send; A.troops -= send;
    if (A.gen && !D.gen){ D.gen = A.gen; A.gen = null; }
    log(st,'调兵：' + send + ' 人自 ' + A.name + ' 移驻 ' + D.name + '。','good');
    return;
  }
  if (st.ap<=0){ log(st,'政令已用尽，无法发动进攻。','bad'); return; }
  st.ap--;
  if (!atWar(st, st.player, D.owner)){
    setWar(st, st.player, D.owner, true);
    log(st,'⚔ 你对 ' + FACTIONS[D.owner].name + ' 宣战。','bad');
  }
  var r = applyBattle(st, runBattle(st, fromId, toId, true));
  var all = r.lines.slice();
  if (r.genMsg) all.push('· ' + r.genMsg);
  try { BARD.play('battle'); } catch(e){}
  showModal('战 报', all.join('\n'), [{l:'继续', f:function(){ try { BARD.play('march'); } catch(e){} refresh(); }}], true);
  log(st, (r.win?'攻占 ':'未能攻下 ') + D.name + '（' + FACTIONS[st.player].name + '）', r.win?'good':'bad');
  checkEnd();
}

/* --------- 弹窗 --------- */
function showModal(title, body, btns, plain){
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = plain ? '<div class="battle-line k">' + String(body).replace(/\n/g,'</div><div class="battle-line">') + '</div>' : body;
  var bb = $('modal-btns'); bb.innerHTML = '';
  (btns||[{l:'确定'}]).forEach(function(b){
    var el = document.createElement('button');
    el.className = 'mbtn'; el.textContent = b.l;
    el.onclick = function(){ $('modal').classList.add('hidden'); if (b.f) b.f(); };
    bb.appendChild(el);
  });
  $('modal').classList.remove('hidden');
}

/* --------- 刷新 --------- */
function refresh(){
  if (!G) return;
  drawMap(); renderTop(); renderSide(); renderLog();
}
function checkEnd(){
  if (!G.over) return;
  if (G.result==='win'){ try { BARD.play('coronation'); } catch(e){}
    showModal('加 冕 为 帝', '你已握有欧洲过半的领地。\n诸王或俯首，或流亡；教皇为你涂上圣油，编年史官写下了你的名字。\n\n' +
      FACTIONS[G.player].name + ' · ' + FACTIONS[G.player].lord + '\n第 ' + G.turn + ' 回合，公元 ' + G.year + ' 年。',
      [{l:'再开一局', f:function(){ location.reload(); }}]);
  } else if (G.result==='lose'){
    showModal('王 冠 落 地', '你的最后一块领地已经易主。\n旗帜被从城头扯下，你的名字只留在修道院的编年史里。\n\n' +
      '坚持了 ' + G.turn + ' 回合，公元 ' + G.year + ' 年。', [{l:'重新开始', f:function(){ location.reload(); }}]);
  }
}

/* --------- 结束回合 --------- */
function endTurnUI(){
  if (G.over) return;
  var ev = endTurn(G);
  var rival = checkRivals(G);
  if (rival && rival.n >= PROVINCES.length*0.42)
    log(G, '⚠ ' + FACTIONS[rival.id].name + ' 已吞并 ' + rival.n + ' 块领地，势头逼人。', 'bad');
  refresh();
  checkEnd();
  if (ev && !G.over){
    showModal(ev.t, ev.txt, ev.ch.map(function(c, i){
      return { l: c.l, f: function(){
        var msg = applyEventChoice(G, ev, i);
        log(G, '【' + ev.t + '】' + msg, 'hl');
        refresh(); checkEnd();
      }};
    }));
  }
}

function pickEvent(st){
  var ps = provsOf(st, st.player), i, hasCoast = false;
  for (i=0;i<ps.length;i++) if (PMAP[ps[i]].terrain==='coast') hasCoast = true;
  var pool = [];
  for (i=0;i<EVENTS.length;i++){
    var e = EVENTS[i];
    if (e.t==='维京长船' && !hasCoast) continue;
    if (e.t==='百年战争的号角' && st.turn < 24) continue;
    if (e.t==='教皇的召唤' && (st.player==='ottoman')) continue;
    if (e.t==='教皇的绝罚' && (st.player==='ottoman'||st.player==='kiev'||st.player==='byzantium')) continue;
    pool.push(e);
  }
  return pool.length ? pool[ri(0,pool.length-1)] : EVENTS[0];
}

function applyEventChoice(st, ev, idx){
  var ctx = { gold:st.gold, prestige:st.prestige, modTrade:0, modTroops:0,
              loyaltyBonus:0, troopsBonus:0, newGeneral:false, troops: totalTroops(st, st.player) };
  var msg = ev.ch[idx].f(ctx);
  st.gold = Math.max(0, Math.round(ctx.gold));
  st.prestige = Math.max(0, Math.round(ctx.prestige));
  var ps = provsOf(st, st.player), i;
  for (i=0;i<ps.length;i++){
    var p = st.provs[ps[i]];
    if (ctx.modTrade) p.trade = clamp(p.trade+ctx.modTrade,5,120);
    if (ctx.modTroops) p.troops = Math.max(60, Math.round(p.troops*(1+ctx.modTroops)));
    if (ctx.loyaltyBonus) p.loyalty = clamp(p.loyalty+ctx.loyaltyBonus,5,100);
  }
  if (ctx.troopsBonus){
    var cap = FACTIONS[st.player].capital;
    if (st.provs[cap] && st.provs[cap].owner===st.player) st.provs[cap].troops += ctx.troopsBonus;
    else if (ps.length) st.provs[ps[0]].troops += ctx.troopsBonus;
  }
  if (ctx.newGeneral){
    var avail = [];
    for (var gn in GTABLE) if (GTABLE[gn].faction===st.player && st.pool[st.player].indexOf(gn)<0) avail.push(gn);
    if (avail.length){ var pick = avail[ri(0,avail.length-1)]; st.pool[st.player].push(pick); msg += '（'+pick+' 来投）'; }
    else { st.prestige += 5; msg += '（朝中已无名将，威望 +5）'; }
  }
  return msg;
}

function saveGame(){
  try {
    localStorage.setItem('crown_sword_save', JSON.stringify(G, function(k,v){ return k.charAt(0)==='_' ? undefined : v; }));
    log(G,'已存档。','good'); refresh();
  } catch(e){ log(G,'存档失败：'+e.message,'bad'); refresh(); }
}
function loadGame(){
  try {
    var s = localStorage.getItem('crown_sword_save');
    if (!s){ log(G,'没有找到存档。','bad'); refresh(); return; }
    buildStatic();
    G = JSON.parse(s);
    $('screen-start').classList.add('hidden');
    $('screen-game').classList.remove('hidden');
    var cv = $('map');
    cv.width = CW; cv.height = CH;
    cv.onclick = onMapClick;
    log(G,'已读档。','good');
    refresh();
  } catch(e){ log(G,'读档失败：'+e.message,'bad'); refresh(); }
}

/* --------- 分享 --------- */
function copyText(t){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; }
  } catch(e){}
  try {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); return true;
  } catch(e){ return false; }
}
function initShare(){
  var box = $('share-box'), loc = (typeof location!=='undefined') ? location : {href:'',protocol:''};
  var online = (loc.protocol === 'http:' || loc.protocol === 'https:');
  if (online){
    box.innerHTML = '<b>分享给朋友</b>：把这个链接发给他，点开就能玩（手机电脑都行）——<br>' +
      '<span class="u" id="share-url"></span>' +
      '<button class="tbtn" id="btn-copy">复制链接</button>';
    $('share-url').textContent = loc.href;
    $('btn-copy').onclick = function(){
      $('btn-copy').textContent = copyText(loc.href) ? '已复制 ✓ 发给朋友吧' : '复制失败，请长按链接手动复制';
    };
  } else {
    box.innerHTML = '<b>分享给朋友</b>：把本文件（王冠与长剑.html）发给他，微信 / QQ / 邮件都行。<br>' +
      '· 手机：点开文件 → 选「用浏览器打开」<br>' +
      '· 电脑：双击文件即可<br>' +
      '· 想变成一条网址？把它传到任意静态托管（GitHub Pages / Netlify / Vercel）即可。';
  }
}

  { id:'map', t:'这就是中世纪的欧洲',

];
var tutIdx = 0;
function startTutorial(force){
  try { if (!force && localStorage.getItem('crown_tut_done') === '1') return; } catch(e){}
  tutIdx = 0;
  $('tut').classList.remove('hidden');
  tutShow();
}
function tutShow(){
  var st = TUT_STEPS[tutIdx];
  if (st.pre) { try { st.pre(); } catch(e){} }
  $('tut-step').textContent = '引导 ' + (tutIdx+1) + ' / ' + TUT_STEPS.length;
  $('tut-title').textContent = st.t;
  $('tut-text').textContent = st.x;
  $('tut-next').textContent = (tutIdx === TUT_STEPS.length-1) ? '开始征战' : '下一步';
  $('tut-skip').style.display = (tutIdx === TUT_STEPS.length-1) ? 'none' : '';
  tutPlace($(st.id));
}
function tutPlace(el){
  var spot = $('tut-spot'), card = $('tut-card');
  var vw = window.innerWidth || 412, vh = window.innerHeight || 800;
  var r = (el && el.getBoundingClientRect) ? el.getBoundingClientRect() : {left:0,top:0,width:vw,height:vh};
  var pad = 6;
  var L = Math.max(4, r.left-pad), T = Math.max(4, r.top-pad);
  var W = Math.min(vw-8, Math.max(40, r.width+pad*2)), H = Math.min(vh-8, Math.max(30, r.height+pad*2));
  spot.style.left = L+'px'; spot.style.top = T+'px';
  spot.style.width = W+'px'; spot.style.height = H+'px';
  card.style.width = Math.min(330, vw-24) + 'px';
  var cw = card.offsetWidth || Math.min(330, vw-24), chh = card.offsetHeight || 150;
  card.style.left = Math.max(12, Math.min(vw-cw-12, L + W/2 - cw/2)) + 'px';
  card.style.top = ((T + H + 14 + chh) < vh) ? (T + H + 14) : Math.max(12, T - chh - 14) + 'px';
}
function tutNext(){
  if (tutIdx >= TUT_STEPS.length-1){ endTutorial(); return; }
  tutIdx++; tutShow();
}
function endTutorial(){
  $('tut').classList.add('hidden');
  try { localStorage.setItem('crown_tut_done','1'); } catch(e){}
}

/* --------- 启动 --------- */
function boot(){
  if (typeof document === 'undefined') return;
  initStart();
  $('btn-endturn').onclick = endTurnUI;
  $('btn-help').onclick = showHelp;
  $('btn-tut').onclick = function(){ startTutorial(true); };
  $('btn-music').onclick = function(){
    var on = BARD.toggle();
    this.textContent = on ? '♪ 音乐开' : '♪ 音乐关';
    log(G, on ? '乐师重新奏乐。' : '乐师退下，音乐已关。', '');
  };
  $('tut-skip').onclick = endTutorial;
  $('tut-next').onclick = tutNext;
  $('btn-save').onclick = saveGame;
  $('btn-load').onclick = loadGame;
}
if (typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('DOMContentLoaded', boot);
}
